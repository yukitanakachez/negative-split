<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Negative Split</title>
<meta name="description" content="Marathon training plan from your goal time, body and a recent race.">
<meta name="theme-color" content="#ede8e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neg Split">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section class="view" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-plan" aria-label="Plan" hidden></section>
  <section class="view" id="v-race" aria-label="Race" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button class="tab" data-tab="today" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Today</button>
  <button class="tab" data-tab="plan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>Plan</button>
  <button class="tab" data-tab="race"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3.5M6 4h12l-2.5 4.5L18 13H6"/></svg>Race</button>
</nav>

<div class="layer" id="ws" hidden><div class="scrim" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Workout"></section></div>
<div class="layer" id="ss" hidden><div class="scrim" data-close></div><section class="sheet tall" role="dialog" aria-modal="true" aria-labelledby="ss-title"></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span><button type="button">Undo</button></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
